aid: tabby-ml
url: https://raw.githubusercontent.com/api-evangelist/tabby-ml/refs/heads/main/apis.yml
name: Tabby
kind: company
description: Tabby is an open-source, self-hosted AI coding assistant - a
  privacy-first alternative to GitHub Copilot from TabbyML (Apache-2.0). You run
  the Tabby server yourself (Docker, a consumer-grade GPU, or your own cloud);
  there is no shared multi-tenant API and no external calls to third parties. The
  server exposes an OpenAPI-documented REST surface (Swagger UI at /swagger-ui,
  spec at /api-docs/openapi.json) for code completion, OpenAI-compatible chat
  completions, an Answer Engine backed by a doc-ingestion knowledge base, health,
  model registry, and telemetry events. Because it is self-hosted, the base URL
  is your own instance (default http://localhost:8080). TabbyML also offers hosted
  Team and Enterprise plans.
