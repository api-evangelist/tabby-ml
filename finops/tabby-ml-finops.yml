description: >-
  FinOps view of Tabby spend. Tabby's server is open source (Apache-2.0) and free
  to self-host - in that model there is no vendor invoice at all; the cost is your
  own compute for running the Tabby server, dominated by the GPU (or CPU) that
  serves the completion and chat models, plus storage for the indexed knowledge
  base. Because Tabby makes no external calls to third parties, there are no
  per-token inference charges to a model vendor. TabbyML's hosted plans convert
  that owned-infrastructure cost into a predictable per-seat subscription: free
  Community (up to 5 users), Team at 19 USD per seat per month (up to 50 users),
  and custom Enterprise.
notes: >-
  Self-hosted cost is essentially GPU/CPU time and storage, not a Tabby license
  fee. Hosted per-seat rates were captured on 2026-07-11; verify on the pricing
  page. The main optimization lever self-hosted is right-sizing the model and
  device to your team's latency needs.
