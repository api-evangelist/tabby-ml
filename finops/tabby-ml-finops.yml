meters:
- name: hosted_seats
  description: Per-seat subscription on hosted Team plans, billed monthly.
  unit: seats
  aggregation: sum
  dimensions:
  - account
- name: self_hosted_compute
  description: GPU/CPU time to run the self-hosted Tabby server (no TabbyML invoice).
  unit: hours
  aggregation: sum
  dimensions:
  - deployment
  - device
- name: index_storage
  description: Storage for the ingested knowledge base and repository index.
  unit: bytes
  aggregation: sum
  dimensions:
  - deployment
principles:
- name: Visibility
  description: On self-hosted, track GPU/CPU hours and storage for the Tabby server; on hosted, track active seats against the plan cap.
- name: Allocation
  description: Map self-hosted Tabby infrastructure to the team(s) it serves, or allocate hosted seats per developer/team.
- name: Optimization
  description: Right-size the model and device to your latency needs; self-host to avoid per-seat fees when you have spare GPU capacity, or use hosted plans to avoid running infrastructure.
- name: Accountability
  description: Assign an owner for the Tabby deployment and review monthly compute/storage cost or seat count against team growth.
