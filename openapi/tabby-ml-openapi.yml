openapi: 3.0.3
info:
  title: Tabby Server API
  description: >-
    Tabby is an open-source, self-hosted AI coding assistant (Apache-2.0) from
    TabbyML. You run the Tabby server yourself; it exposes an OpenAPI-documented
    REST surface for code completion, OpenAI-compatible chat completions, an
    Answer Engine backed by a doc-ingestion knowledge base, health, the model
    registry, and telemetry events. The interactive Swagger UI is served at
    /swagger-ui and the raw spec at /api-docs/openapi.json on your own instance.
    Because Tabby is self-hosted, the server URL below is a placeholder for your
    own deployment (default port 8080); replace it with your instance host.
    Endpoints authenticate with a Bearer registration token. Completion and chat
    endpoints return 501 Not Implemented when the corresponding model is not
    configured.
  version: '0.17.0'
  contact:
    name: TabbyML
    url: https://www.tabbyml.com
  license:
    name: Apache-2.0
    url: https://github.com/TabbyML/tabby/blob/main/LICENSE
servers:
  - url: http://localhost:8080
    description: Self-hosted Tabby instance (default). Replace host and port with your own deployment.
security:
  - bearerAuth: []
tags:
  - name: Completions
    description: Code completion endpoint powering Tabby's IDE plugins.
  - name: Chat
    description: OpenAI-compatible chat completions and inline chat / Answer Engine.
  - name: Ingestion
    description: Doc ingestion into the Answer Engine knowledge base.
  - name: Models
    description: Model registry configured on the server.
  - name: Health
    description: Server health and settings.
  - name: Events
    description: Client telemetry event logging.
paths:
  /v1/completions:
    post:
      operationId: completion
      tags:
        - Completions
      summary: Code completion
      description: >-
        Generates code completions for the code around the cursor. Accepts the
        language and code segments (prefix and suffix), applies
        retrieval-augmented generation over indexed repositories, and returns
        ranked completion choices. Returns 501 when no completion model is
        configured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompletionRequest'
      responses:
        '200':
          description: Completion choices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompletionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '501':
          description: No completion model configured.
  /v1/chat/completions:
    post:
      operationId: chatCompletions
      tags:
        - Chat
      summary: Chat completion (OpenAI-compatible)
      description: >-
        OpenAI-compatible chat completions. Streams responses as Server-Sent
        Events. Powers Tabby's inline chat and Answer Engine. Returns 501 when no
        chat model is configured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
      responses:
        '200':
          description: A stream of chat completion chunks (text/event-stream) or a JSON completion.
          content:
            text/event-stream:
              schema:
                type: string
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '501':
          description: No chat model configured.
  /v1beta/chat/completions:
    post:
      operationId: chatCompletionsBeta
      tags:
        - Chat
      summary: Chat completion (legacy alias)
      description: Backward-compatible alias of POST /v1/chat/completions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
      responses:
        '200':
          description: A stream of chat completion chunks (text/event-stream) or a JSON completion.
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '501':
          description: No chat model configured.
  /v1beta/ingestion:
    post:
      operationId: ingestion
      tags:
        - Ingestion
      summary: Ingest a document into the Answer Engine
      description: >-
        Submit a document to be indexed asynchronously into Tabby's knowledge
        system so it can be cited as context during code assistance. Documents
        are grouped by source and can carry an optional time-to-live (ttl).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestionRequest'
      responses:
        '200':
          description: Ingestion accepted and queued for indexing.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1beta/models:
    get:
      operationId: models
      tags:
        - Models
      summary: List configured models
      description: Returns the model registry configured on the server (completion and chat models).
      responses:
        '200':
          description: The configured model registry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelRegistry'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/health:
    get:
      operationId: health
      tags:
        - Health
      summary: Server health and configuration
      description: >-
        Reports the server's runtime configuration and readiness - completion
        model, device, chat model, chat device, and webserver settings.
      responses:
        '200':
          description: Health and configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthState'
  /v1beta/server_setting:
    get:
      operationId: serverSetting
      tags:
        - Health
      summary: Server settings
      description: >-
        Returns additional server settings. Always available on OSS builds; on
        Enterprise builds available only when the webserver is disabled.
      responses:
        '200':
          description: Server settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerSetting'
  /v1/events:
    post:
      operationId: event
      tags:
        - Events
      summary: Log a client telemetry event
      description: >-
        Logs completion-acceptance and other client telemetry events so a
        self-hosted deployment can measure suggestion quality locally.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogEventRequest'
      responses:
        '200':
          description: Event recorded.
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        Bearer token authentication. Use the registration token from the Tabby
        web UI (Information -> System -> Registration token), passed as
        `Authorization: Bearer YOUR_TOKEN`.
  responses:
    Unauthorized:
      description: Missing or invalid bearer token.
  schemas:
    CompletionRequest:
      type: object
      properties:
        language:
          type: string
          description: Programming language identifier (e.g. python, rust, typescript).
          example: python
        segments:
          $ref: '#/components/schemas/Segments'
        user:
          type: string
          description: Optional opaque user identifier for telemetry.
        temperature:
          type: number
          format: float
          description: Optional sampling temperature.
    Segments:
      type: object
      properties:
        prefix:
          type: string
          description: Code before the cursor.
        suffix:
          type: string
          description: Code after the cursor.
        filepath:
          type: string
          description: Path of the file being edited.
      required:
        - prefix
    CompletionResponse:
      type: object
      properties:
        id:
          type: string
        choices:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              text:
                type: string
        debug_data:
          type: object
          description: Optional debug metadata (prompt, snippets) when debug is enabled.
    ChatCompletionRequest:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        model:
          type: string
        stream:
          type: boolean
          default: true
        temperature:
          type: number
          format: float
      required:
        - messages
    ChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [system, user, assistant]
        content:
          type: string
      required:
        - role
        - content
    ChatCompletionResponse:
      type: object
      properties:
        id:
          type: string
        choices:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              message:
                $ref: '#/components/schemas/ChatMessage'
    IngestionRequest:
      type: object
      properties:
        source:
          type: string
          description: Logical group the document belongs to.
        id:
          type: string
          description: Unique identifier for the document within its source.
        title:
          type: string
        body:
          type: string
          description: Document content.
        link:
          type: string
          description: Optional URL reference.
        ttl:
          type: string
          description: Optional expiry window, e.g. "180d".
      required:
        - source
        - id
        - body
    ModelRegistry:
      type: object
      properties:
        completion:
          type: array
          items:
            type: string
        chat:
          type: array
          items:
            type: string
    HealthState:
      type: object
      properties:
        model:
          type: string
        device:
          type: string
        chat_model:
          type: string
        chat_device:
          type: string
        webserver:
          type: boolean
    ServerSetting:
      type: object
      properties:
        disable_client_side_telemetry:
          type: boolean
    LogEventRequest:
      type: object
      properties:
        type:
          type: string
          description: Event type, e.g. view, select, dismiss.
        completion_id:
          type: string
        choice_index:
          type: integer
      required:
        - type
