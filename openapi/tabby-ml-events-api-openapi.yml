openapi: 3.2.0
info:
  title: Tabby Server Events API
  description: Tabby is an open-source, self-hosted AI coding assistant (Apache-2.0) from TabbyML.
  version: 0.17.0
  contact:
    name: TabbyML
    url: https://www.tabbyml.com
  license:
    name: Apache-2.0
    url: https://github.com/TabbyML/tabby/blob/main/LICENSE
servers:
- url: http://localhost:8080
  description: Self-hosted Tabby instance (default). Replace host and port with your own deployment.
security:
- bearerAuth: []
tags:
- name: Events
  description: Client telemetry event logging.
paths:
  /v1/events:
    post:
      operationId: event
      tags:
      - Events
      summary: Log a client telemetry event
      description: Logs completion-acceptance and other client telemetry events so a self-hosted deployment can measure suggestion quality locally.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogEventRequest'
      responses:
        '200':
          description: Event recorded.
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  schemas:
    LogEventRequest:
      type: object
      properties:
        type:
          type: string
          description: Event type, e.g. view, select, dismiss.
        completion_id:
          type: string
        choice_index:
          type: integer
      required:
      - type
  responses:
    Unauthorized:
      description: Missing or invalid bearer token.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Bearer token authentication. Use the registration token from the Tabby web UI (Information -> System -> Registration token), passed as `Authorization: Bearer YOUR_TOKEN`.'
